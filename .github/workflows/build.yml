name: Build Meteora Drum (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ART="build/MeteoraDrum_artefacts/Release"
          cp -R "$ART"/VST3/*.vst3 dist/
          if [ -d "$ART/Standalone" ]; then mkdir -p dist/Standalone && cp -R "$ART"/Standalone/* dist/Standalone/; fi
          cp README.md dist/
          ls -R dist | head -50

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MeteoraDrum-Windows
          path: dist
